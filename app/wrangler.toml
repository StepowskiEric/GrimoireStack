# wrangler.toml — Pages Functions configuration
# Used for local dev and binding configuration.
# The AI binding must also be configured in the Cloudflare dashboard:
#   Pages > grimoirestack > Settings > Bindings > Add > Workers AI
#   Variable name: AI

name = "grimoirestack"

pages_build_output_dir = "dist"

[ai]
binding = "AI"

# Cross-device favorites sync — KV namespace id is provisioned
# once via `npx wrangler kv namespace create FAVORITES`. The
# binding below wires that namespace into the Pages Function
# in functions/api/favorites-sync.js.
[[kv_namespaces]]
binding = "FAVORITES"
id = "a453372cb3eb4ee1a2492eb193194d97"

# Rate limit for sync code writes (binding: SYNC_WRITES) is configured
# in the Cloudflare dashboard, not in wrangler.toml:
#   Pages > grimoirestack > Settings > Bindings > Add > Rate limiting
#   Name: SYNC_WRITES
#   Namespace: 19c1ca7d-48b3-4c9d-b531-648245dcc08b (pre-created via
#     `npx wrangler rate_limit create favorites-sync-writes`)
#   Limit: 10, Period: 60
# The Pages PATCH API does not support rate_limit bindings as of 2026-07,
# and [[ratelimits]] / [[unsafe.bindings]] are not accepted in wrangler.toml
# for Pages projects. The function fails open when the binding is missing,
# so the deploy is safe without it.

# Rate limiting for /api/recommend (binding: RECOMMEND) — protects the
# Groq API quota (14k free req/day). Configure in the Cloudflare dashboard:
#   Pages > grimoirestack > Settings > Bindings > Add > Rate limiting
#   Name: RECOMMEND
#   Limit: 20, Period: 60 (20 requests per minute per IP)
# The function fails open when the binding is missing.
#
# Rate limiting for /api/llm-proxy (binding: LLM_PROXY) — prevents abuse
# as a free LLM proxy. Configure in the dashboard:
#   Name: LLM_PROXY
#   Limit: 30, Period: 60
#
# GROQ_API_KEY is set as a production secret:
#   npx wrangler pages secret put GROQ_API_KEY --project-name grimoirestack
# Optional: GROQ_MODEL to override the default model (llama-3.1-8b-instant).
